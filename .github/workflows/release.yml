name: Release
# A release happens when the version in Smiler.toc changes on main: the job tags it and uploads to Wago and GitHub.
# (Pushing a v* tag by hand still works too.)
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the version in Smiler.toc if it isn't tagged yet
        id: tag
        run: |
          ver=$(sed -n 's/^## Version: *\([0-9][0-9.]*\).*/\1/p' Smiler.toc | head -1)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "release=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            if gh release view "v$ver" >/dev/null 2>&1; then
              echo "v$ver is already released - nothing to do"; echo "release=no" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "v$ver is tagged but not released yet - building it"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$ver" -m "Smiler v$ver"
            git push origin "v$ver"
          fi
          # build from the tag itself, so the packager sees a proper release (not a branch alpha)
          gh workflow run release.yml --ref "v$ver"
          echo "release=dispatched" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and upload
        if: steps.tag.outputs.release == 'yes'
        uses: BigWigsMods/packager@v2
        with:
          args: -g retail
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
