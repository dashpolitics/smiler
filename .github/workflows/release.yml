name: Release
# A release happens when the version in Smiler.toc changes on main: the job tags it and uploads to Wago and GitHub.
# (Pushing a v* tag by hand still works too.)
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the version in Smiler.toc if it isn't tagged yet
        id: tag
        run: |
          ver=$(sed -n 's/^## Version: *\([0-9][0-9.]*\).*/\1/p' Smiler.toc | head -1)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "release=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "v$ver already exists - nothing to release"; echo "release=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$ver" -m "Smiler v$ver"
          git push origin "v$ver"
          echo "release=yes" >> "$GITHUB_OUTPUT"
      - name: Package and upload
        if: steps.tag.outputs.release == 'yes'
        uses: BigWigsMods/packager@v2
        with:
          args: -g retail
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
